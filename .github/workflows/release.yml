on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  # builds without releasing, to check the signing secrets
  workflow_dispatch:

# Scripts/release.sh pushes the tag right after its commit is pushed to main. This run tests that
# commit too, so it cancels the one of ci.yml instead of running two macOS runners
concurrency:
  group: mac-${{ github.sha }}
  cancel-in-progress: true

jobs:
  build-mac:
    runs-on: macos-latest
    env:
      BUILD_CERTIFICATE_BASE64: ${{ secrets.MAC_BUILD_CERTIFICATE_BASE64 }}
      P12_PASSWORD: ${{ secrets.MAC_BUILD_CERTIFICATE_BASE64_PASSWORD }}
      KEYCHAIN_PASSWORD: ${{ secrets.MAC_BUILD_CERTIFICATE_BASE64_PASSWORD }}
      APP_CERTIFICATE: ${{ secrets.MAC_APP_CERTIFICATE }}
      SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/checkout@v7

      - name: Tests
        run: make test test-runtime

      # The builds without a tag (workflow_dispatch) are 0.0.0
      - name: Version
        id: version
        run: |
          version=0.0.0
          [[ "$GITHUB_REF" == refs/tags/v* ]] && version=${GITHUB_REF_NAME#v}
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "VERSION=$version" >> "$GITHUB_ENV"

      # In a keychain of the runner, which is discarded after the job
      - name: Install the signing certificate
        run: |
          for name in BUILD_CERTIFICATE_BASE64 P12_PASSWORD KEYCHAIN_PASSWORD APP_CERTIFICATE SPARKLE_PRIVATE_KEY; do
            [[ -n "${!name}" ]] || { echo "Error: the secret for $name isn't set" >&2; exit 1; }
          done

          keychain="$RUNNER_TEMP/app-signing.keychain-db"
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$keychain"
          security list-keychain -d user -s "$keychain"

      - name: Build app
        run: |
          # Manual signing, there's no Apple account on the runner to sign automatically. The
          # packages go in build/ for the Sparkle tools of the next step
          xcodebuild archive -target KeyRemapper -configuration Release \
            -clonedSourcePackagesDirPath build/SourcePackages \
            MARKETING_VERSION="$VERSION" \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY="$APP_CERTIFICATE"

      # The DMG to install it, by dragging it to Applications, and the appcast.xml that the
      # installed apps check for updates (SUFeedURL), with the DMG signed with the Sparkle key
      - name: Package
        run: |
          name="KeyRemapper-$VERSION"
          mkdir -p dist/dmg dist/release

          # build/Release/KeyRemapper.app is a symlink to the archived app, -H follows it
          cp -RH build/Release/KeyRemapper.app dist/dmg
          ln -s /Applications dist/dmg/Applications
          # hdiutil sometimes fails on the runners with "Resource busy"
          for attempt in 1 2 3; do
            hdiutil create -volname KeyRemapper -srcfolder dist/dmg -format UDZO "dist/release/$name.dmg" && break
            [[ $attempt == 3 ]] && exit 1
            sleep 5
          done

          # Scripts/release.sh writes the notes in the annotated tag message
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
            git tag -l --format='%(contents:body)' "$GITHUB_REF_NAME" > "dist/release/$name.md"
          fi

          echo "$SPARKLE_PRIVATE_KEY" | build/SourcePackages/artifacts/sparkle/Sparkle/bin/generate_appcast \
            --ed-key-file - --embed-release-notes \
            --download-url-prefix "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/" \
            --link "https://github.com/$GITHUB_REPOSITORY" \
            dist/release

      - name: Upload release files
        uses: actions/upload-artifact@v7
        with:
          name: macArtifact
          retention-days: 1
          path: |
            dist/release/*.dmg
            dist/release/*.md
            dist/release/appcast.xml

  release:
    runs-on: ubuntu-latest
    needs: [build-mac]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: macArtifact
          path: release

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          body_path: release/KeyRemapper-${{ needs.build-mac.outputs.version }}.md
          files: |
            release/*.dmg
            release/appcast.xml
